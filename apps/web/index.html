<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classifier · 文档研读</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/katex.css">
</head>
<body>
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="library" class="library" aria-label="文献库" hidden>
    <div class="library-head"><div class="brand"><span class="logo">C</span><div>Classifier<small>文档研读</small></div></div><button id="close-library" class="icon-button" type="button" aria-label="关闭文献库">×</button></div>
    <button id="drawer-import" class="library-import" type="button">＋ 导入文档</button>
    <div class="library-section"><span class="eyebrow">我的文档</span><nav id="documents" aria-label="文档列表"></nav></div>
  </aside>

  <main>
    <header class="app-header">
      <div class="header-start"><button id="library-toggle" class="header-button" type="button" aria-controls="library" aria-expanded="false">☰ <span>文献库</span></button><span class="header-divider"></span><span class="header-brand">Classifier</span></div>
      <div class="header-actions"><button id="import-open" class="header-button" type="button">＋ 导入文档</button><a id="download" class="header-button" hidden>下载原文件 ↗</a></div>
    </header>

    <section id="welcome" class="welcome"><span class="eyebrow">文档研读</span><h1>从原文找到答案。</h1><p>导入论文或其他资料，搜索内容、提出问题，并随时回到原文核对。</p><button id="welcome-import" type="button">导入第一份文档 ↗</button></section>

    <section id="workspace" hidden>
      <div class="document-heading"><div><h1 id="title"></h1><p id="meta"></p></div><button id="warnings-toggle" class="quiet-button" type="button" aria-controls="warnings" aria-expanded="false" hidden>识别提醒</button></div>
      <div id="warnings" class="warnings" hidden><p id="warning-text"></p><button id="warnings-close" class="icon-button" type="button" aria-label="关闭识别提醒">×</button></div>
      <div class="workspace-grid">
        <section class="conversation" aria-label="问答与检索">
          <div class="section-head"><h2 id="conversation-title">文档问答</h2><span id="conversation-mode"></span></div>
          <div id="history" aria-live="polite"></div>
          <form id="question-form"><label id="question-label" for="question">问题</label><textarea id="question" required maxlength="4000"></textarea><div class="form-bottom"><span id="question-hint"></span><button id="cancel" type="button" hidden>停止</button><button id="ask" type="submit">提问 ↗</button></div></form>
          <p id="error" role="alert"></p>
        </section>

        <section id="source-panel" class="source" aria-label="文档原文">
          <div class="section-head"><h2>原文</h2><button id="reference-search-toggle" class="quiet-button" type="button" aria-expanded="false">查找原文</button></div>
          <div id="reference-search" class="reference-search" hidden><label for="reference-query">搜索当前文档</label><input id="reference-query" type="search" placeholder="输入关键词查找片段"><p id="reference-count" class="hint"></p><div id="reference-results"></div></div>
          <div id="selected-excerpt" class="selected-excerpt" hidden></div>
          <div id="page-review" class="page-review" hidden>
            <div class="page-controls"><button id="prev-page" class="page-button" type="button">上一页</button><span id="page-label"></span><button id="next-page" class="page-button" type="button">下一页</button></div>
            <p id="page-notice" class="page-notice" hidden></p><p id="page-error" role="status"></p>
            <div class="page-image"><img id="page-image" alt="PDF 原始页面"><div id="page-highlight" hidden></div></div>
          </div>
          <div id="references" class="document-content" hidden></div>
        </section>
      </div>
    </section>
  </main>

  <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-title">
    <div class="dialog-head"><div><span class="eyebrow">添加资料</span><h2 id="import-title">导入文档</h2></div><button id="close-import" class="icon-button" type="button" aria-label="关闭导入窗口">×</button></div>
    <p>支持 PDF、Word、Markdown、TXT 和 HTML。导入后可直接查找原文。</p>
    <button id="choose-file" class="upload" type="button">选择文件</button><input id="file" type="file" accept=".pdf,.docx,.md,.markdown,.txt,.html" multiple hidden>
    <details class="import-advanced"><summary>识别设置</summary><label for="parse-mode">处理方式</label><select id="parse-mode"><option value="auto">本地自动识别（推荐）</option><option value="ocr">全页 OCR（扫描或混合文档）</option><option value="vision" disabled>视觉增强（尚未配置）</option></select><p id="parser-status" class="hint"></p></details>
    <p id="upload-status" role="status"></p><button id="cancel-import" class="quiet-button" type="button" hidden>取消当前导入</button>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
